name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-ui.txt
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/requirements.txt -r desktop/requirements-ui.txt
      - name: Run desktop tests
        env:
          PYTHONPATH: desktop/src
        run: python -m unittest discover -s desktop/tests
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Lint, test, and build debug APK
        run: ./android/gradlew -p android lintDebug testDebugUnitTest assembleDebug
