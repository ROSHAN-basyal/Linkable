[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkable-desktop"
version = "0.1.0"
description = "Linux desktop companion for the Linkable protocol."
requires-python = ">=3.11"
authors = [
  { name = "rsnb" }
]
dependencies = [
  "protobuf>=5.27.0",
  "zeroconf>=0.131.0",
  "cryptography>=43.0.0",
  "PyQt6>=6.7,<7",
]

[project.scripts]
linkable-desktop = "linkable_desktop.ui_pyqt.app:main"

[tool.setuptools.packages.find]
where = ["src"]
