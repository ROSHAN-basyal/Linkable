syntax = "proto3";

package linkable.protocol.v1;

option java_multiple_files = true;
option java_package = "com.linkable.protocol.v1";
option java_outer_classname = "CommonProto";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message Timestamp {
  int64 unix_epoch_ms = 1;
}

message DeviceId {
  string fingerprint = 1;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_INITIATOR = 1;
  ROLE_ACCEPTOR = 2;
}

enum PacketType {
  PACKET_TYPE_UNSPECIFIED = 0;

  PACKET_TYPE_PAIRING_REQUEST = 1001;
  PACKET_TYPE_PAIRING_CHALLENGE = 1002;
  PACKET_TYPE_PAIRING_CONFIRM = 1003;
  PACKET_TYPE_PAIRING_COMPLETE = 1004;
  PACKET_TYPE_PAIRING_REJECT = 1005;

  PACKET_TYPE_SESSION_INIT = 2001;
  PACKET_TYPE_SESSION_ACK = 2002;
  PACKET_TYPE_SESSION_ROTATE = 2003;
  PACKET_TYPE_SESSION_CLOSE = 2004;

  PACKET_TYPE_PING = 3001;
  PACKET_TYPE_PONG = 3002;
  PACKET_TYPE_DEVICE_INFO_REQUEST = 3003;
  PACKET_TYPE_DEVICE_INFO_RESPONSE = 3004;
  PACKET_TYPE_CAPABILITIES_REQUEST = 3005;
  PACKET_TYPE_CAPABILITIES_RESPONSE = 3006;
  PACKET_TYPE_HEARTBEAT = 3007;

  PACKET_TYPE_NOTIFICATION_POSTED = 4001;
  PACKET_TYPE_NOTIFICATION_REMOVED = 4002;
  PACKET_TYPE_NOTIFICATION_REPLY_REQUEST = 4003;
  PACKET_TYPE_NOTIFICATION_REPLY_RESULT = 4004;
  PACKET_TYPE_NOTIFICATION_ACTION_REQUEST = 4005;
  PACKET_TYPE_NOTIFICATION_ACTION_RESULT = 4006;

  PACKET_TYPE_FILE_OFFER = 5001;
  PACKET_TYPE_FILE_CHUNK = 5002;
  PACKET_TYPE_FILE_COMPLETE = 5003;
  PACKET_TYPE_FILE_TRANSFER_RESULT = 5004;

  PACKET_TYPE_RING_PHONE_REQUEST = 6001;
  PACKET_TYPE_RING_PHONE_RESULT = 6002;

  PACKET_TYPE_CALL_STATE_EVENT = 7001;
  PACKET_TYPE_CALL_CONTROL_REQUEST = 7002;
  PACKET_TYPE_CALL_CONTROL_RESULT = 7003;
  PACKET_TYPE_DIAL_REQUEST = 7004;
  PACKET_TYPE_DIAL_RESULT = 7005;
  PACKET_TYPE_TELEPHONY_DIAGNOSTICS_REQUEST = 7006;
  PACKET_TYPE_TELEPHONY_DIAGNOSTICS_RESULT = 7007;
  PACKET_TYPE_CALL_METADATA_EVENT = 7008;
  PACKET_TYPE_PHONE_CAPABILITY_SNAPSHOT = 7009;

  PACKET_TYPE_BLUETOOTH_ASSIST_DESKTOP_STATUS = 8001;
  PACKET_TYPE_BLUETOOTH_ASSIST_PHONE_STATUS = 8002;

  PACKET_TYPE_DESKTOP_INPUT_REQUEST = 8501;
  PACKET_TYPE_DESKTOP_INPUT_RESULT = 8502;

  PACKET_TYPE_SHARED_APPS_SNAPSHOT = 8601;
  PACKET_TYPE_SHARED_APP_LAUNCH_REQUEST = 8602;
  PACKET_TYPE_SHARED_APP_LAUNCH_RESULT = 8603;

  PACKET_TYPE_PHONE_FILE_LIST_REQUEST = 8701;
  PACKET_TYPE_PHONE_FILE_LIST_RESPONSE = 8702;
  PACKET_TYPE_PHONE_FILE_PULL_REQUEST = 8703;
  PACKET_TYPE_PHONE_FILE_PULL_RESULT = 8704;

  PACKET_TYPE_PHONE_CONTACTS_REQUEST = 8801;
  PACKET_TYPE_PHONE_CONTACTS_RESPONSE = 8802;
  PACKET_TYPE_PHONE_RECENT_CONTACTS_REQUEST = 8803;
  PACKET_TYPE_PHONE_RECENT_CONTACTS_RESPONSE = 8804;

  PACKET_TYPE_CAMERA_CAPABILITY_REQUEST = 8901;
  PACKET_TYPE_CAMERA_CAPABILITY_RESPONSE = 8902;
  PACKET_TYPE_CAMERA_STREAM_START_REQUEST = 8903;
  PACKET_TYPE_CAMERA_STREAM_START_RESULT = 8904;
  PACKET_TYPE_CAMERA_STREAM_ACK = 8905;
  PACKET_TYPE_CAMERA_STREAM_STOP_REQUEST = 8906;
  PACKET_TYPE_CAMERA_STREAM_STOP_RESULT = 8907;
  PACKET_TYPE_CAMERA_STREAM_STATUS_EVENT = 8908;
  PACKET_TYPE_CAMERA_FRAME = 8909;

  PACKET_TYPE_CLIPBOARD_UPDATE = 8951;

  PACKET_TYPE_ERROR = 9001;
}

message PeerDescriptor {
  DeviceId device_id = 1;
  string device_name = 2;
  string platform = 3;
  ProtocolVersion protocol_version = 4;
  bytes identity_public_key = 5;
}

message Envelope {
  ProtocolVersion protocol_version = 1;
  PacketType packet_type = 2;
  uint64 sequence_number = 3;
  bytes payload = 4;
}
