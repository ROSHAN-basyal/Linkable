syntax = "proto3";

package linkable.protocol.v1;

option java_multiple_files = true;
option java_package = "com.linkable.protocol.v1";
option java_outer_classname = "ClipboardProto";

import "common.proto";

message ClipboardUpdate {
  string update_id = 1;
  string text = 2;
  string mime_type = 3;
  uint32 text_length = 4;
  Timestamp updated_at = 5;
  string source_device_id = 6;
  string source_device_name = 7;
}
